[pytest]
testpaths = tests dashboard/tests
python_files = test_*.py
addopts = -q
# Verona's dashboard tests are async.
asyncio_mode = auto
# Note: tests never reach a real cluster or the real ticket store. The
# Kubernetes API is mocked and every ticket test uses a tmp_path database.
# Live verification is scripts/validate.sh, deliberately not part of `pytest`.
