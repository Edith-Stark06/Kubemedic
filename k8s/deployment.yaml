apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-booking
  namespace: opspilot
  labels:
    app: ticket-booking
    app.kubernetes.io/part-of: opspilot
spec:
  replicas: 2
  revisionHistoryLimit: 10
  # maxUnavailable: 0 keeps healthy (old) pods serving if a new revision is bad,
  # so a regression shows up as a stuck rollout / NotReady new pods rather than
  # an outage. Safe, realistic, and cleanly reversible.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ticket-booking
  template:
    metadata:
      labels:
        app: ticket-booking
    spec:
      containers:
        - name: app
          image: ticketbooking:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          # Image supplies APP_VERSION/HEALTHY. The "bad" image (ticketbooking:1.1,
          # baked HEALTHY=false) is how the deterministic readiness regression
          # ships. Readiness uses /ready, which the app fails when HEALTHY=false,
          # so the new pod never becomes Ready and the rollout stalls.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Liveness is a plain TCP check, deliberately NOT /health -- the app
          # honestly returns 500 there when degraded, and wiring that to liveness
          # would crash-loop the pod. TCP keeps it Running-but-NotReady, which is
          # a clean, readable readiness regression.
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
