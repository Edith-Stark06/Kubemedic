name: CI

on:
  push:
    branches: [main, ramana, verona, "shivraj/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor the syntax needs; 3.13 is what the project is
        # developed on. Both are checked so a contributor on either is safe.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall -q agent mcp_server dashboard workload

      - name: Test suite
        run: python -m pytest

      # These three imports are what a fresh clone must survive. They have all
      # broken before: dashboard/app.py still imports symbols that no longer
      # exist, and the MCP server used to create a database at import time.
      - name: Import the MCP server
        run: python -c "import mcp_server.server; print('mcp_server.server ok')"

      - name: Import the agent API
        run: python -c "import agent.api; print('agent.api ok')"

      - name: Import the dashboard
        run: python -c "import dashboard.app; print('dashboard.app ok')"

      - name: MCP evidence profile is read-only
        # The safety claim in .bob/mcp.json, asserted in CI rather than trusted.
        run: |
          python - <<'PY'
          from mcp_server.server import visible_tools, MUTATING_TOOLS
          names = {t.name for t in visible_tools("evidence")}
          assert names.isdisjoint(MUTATING_TOOLS), f"mutating tool exposed: {names & MUTATING_TOOLS}"
          forbidden = {"rollback_deployment", "restart_deployment", "scale_workload"}
          assert names.isdisjoint(forbidden), "a cluster mutation tool is on the evidence profile"
          print(f"evidence profile is read-only: {len(names)} tools")
          PY

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build artifacts or runtime state in the tree
        run: |
          set -e
          bad=$(git ls-files | grep -E '(\.venv/|__pycache__/|\.pyc$|\.db$|^\.env$)' || true)
          if [ -n "$bad" ]; then echo "tracked files that should be ignored:"; echo "$bad"; exit 1; fi
          echo "no build artifacts or runtime state tracked"

      - name: No developer-local absolute paths
        run: |
          set -e
          # AGENTS.md forbids these: they make a script unrunnable on any other
          # machine, which is a reproducibility failure a judge will hit first.
          bad=$(git grep -nE '(/c/Users/|C:\\\\Users\\\\|/home/[a-z]+/Desktop)' -- \
                  ':!docs/*' ':!*.md' || true)
          if [ -n "$bad" ]; then echo "absolute local paths:"; echo "$bad"; exit 1; fi
          echo "no absolute local paths outside documentation"

      - name: No credentials committed
        run: |
          set -e
          bad=$(git grep -nEi '(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_-]{16,}' -- \
                  ':!*.md' ':!docs/*' ':!.github/*' || true)
          if [ -n "$bad" ]; then echo "possible credential:"; echo "$bad"; exit 1; fi
          echo "no credentials found"
